<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bell and Corner">
  <title>Bell &amp; Corner</title>
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <!-- ground -->
    <rect width="512" height="512" fill="#0e1014"/>

    <!-- the two corners, opposed -->
    <path d="M0 0 H300 L0 300 Z" fill="#e5484d"/>
    <path d="M512 512 H212 L512 212 Z" fill="#4a8fe7"/>
  </g>

  <!-- the single signature that decides between them -->
  <circle cx="256" cy="256" r="74" fill="#0e1014"/>
  <circle cx="256" cy="256" r="52" fill="#e8b339"/>
</svg>
